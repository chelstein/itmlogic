version: "3.9"

# Local Genoa stack — full service mesh.
# Sidecars are optional: removing them must NOT break /api/exhibits/compute
# for FM (engine falls back gracefully and emits SIDECAR_UNAVAILABLE).

services:

  genoa-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     genoa
      POSTGRES_PASSWORD: genoa
      POSTGRES_DB:       genoa
    ports: [ "5432:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genoa"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - genoa-pg:/var/lib/postgresql/data

  genoa-api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      genoa-postgres: { condition: service_healthy }
    environment:
      NODE_ENV:                 development
      PORT:                     "8080"
      DATABASE_URL:             postgres://genoa:genoa@genoa-postgres:5432/genoa
      PG_SSL:                   "false"
      TERRAIN_SIDECAR_URL:      http://genoa-terrain-sidecar:8081
      MEASUREMENT_SIDECAR_URL:  http://genoa-measurement-sidecar:8082
      IDENTITY_SIDECAR_URL:     http://genoa-identity-sidecar:8083
      ZERO_TRUST_RADIO_READONLY_URL: ""
      RADIODNS_RESOLVER_URL:    ""
      SPACES_ENDPOINT:          ""
      SPACES_BUCKET:            ""
      SPACES_ACCESS_KEY_ID:     ""
      SPACES_SECRET_ACCESS_KEY: ""
      VOACAP_SIDECAR_URL:       http://genoa-voacap-sidecar:8086
      # FCCAM Wang 1985 skywave sidecar — set to http://host:8090 when deployed.
      # Without it, AM NIF falls back to Berry 1968 (screening-grade).
      FCCAM_SIDECAR_URL:        http://genoa-fccam-sidecar:8090
      # FAA OE/AAA determination proxy — set to operator-managed bridge URL.
      FAA_OE_SIDECAR_URL:       ""
      # FCCGW (FCC/OET R86-1 Ground Wave) advisory sidecar.
      # Runs natively on the host at port 8096 — NOT a Docker service.
      # Set to http://host.docker.internal:8096 (Docker Desktop) or
      # http://<host-ip>:8096 (Linux) when the sidecar is running.
      # See genoa/src/sidecars/fccgw/fccgw-api.service for the systemd unit.
      FCCGW_SIDECAR_URL:        ""
    ports: [ "8080:8080" ]

  genoa-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    depends_on:
      genoa-postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://genoa:genoa@genoa-postgres:5432/genoa
      PG_SSL:       "false"
      WORKER_POLL_MS:           "5000"
      JOB_REAP_STALE_AFTER_MS: "1800000"

  genoa-terrain-sidecar:
    build:
      context: .
      dockerfile: infra/docker/sidecar-terrain.Dockerfile
    environment:
      PORT: "8081"
      TERRAIN_BACKEND: ""   # set to splat | itmlogic | ztrpsits when wired
    ports: [ "8081:8081" ]

  genoa-measurement-sidecar:
    build:
      context: .
      dockerfile: infra/docker/sidecar-measurement.Dockerfile
    environment:
      PORT: "8082"
    ports: [ "8082:8082" ]

  genoa-identity-sidecar:
    build:
      context: .
      dockerfile: infra/docker/sidecar-identity.Dockerfile
    environment:
      PORT: "8083"
      RADIODNS_RESOLVER_URL: ""
      MASSDNS_RESOLVER_URL:  ""
      EAS_TOOLS_URL:         ""
      ZERO_TRUST_RADIO_READONLY_URL: ""
    ports: [ "8083:8083" ]

  genoa-voacap-sidecar:
    build:
      context: src/sidecars/voacap
      dockerfile: Dockerfile
    environment:
      PORT: "8086"
    ports: [ "8086:8086" ]

  # FCCAM sidecar — wraps FCC's Fccam.for (Wang 1985 / §73.190(c)).
  # BUILD REQUIRES: place Fccam.for from https://www.fcc.gov/media/radio/am-skywave-program
  # into src/sidecars/fccam/ before running docker-compose build.
  # Comment this service out if Fccam.for has not been obtained.
  genoa-fccam-sidecar:
    build:
      context: src/sidecars/fccam
      dockerfile: Dockerfile
    environment:
      PORT: "8090"
    ports: [ "8090:8090" ]

volumes:
  genoa-pg:
